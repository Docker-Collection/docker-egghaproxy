name: Docker

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 16 * * 1"
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
  pull_request:
    paths:
      - Dockerfile

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker build
    uses: Docker-Collection/reusable-workflows/.github/workflows/docker-build.yml@c9129c155baf02cc87326eba88a6b08c6895d608 # main
    with:
      docker_name: "ghcr.io/docker-collection/egghaproxy"
      docker_label_author: "Efina"
      docker_label_title: "Docker HaProxyEgg"
      docker_label_description: "A pterodactyl egg for haproxy"
